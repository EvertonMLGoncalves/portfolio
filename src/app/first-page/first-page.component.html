<section class="hero container">
  <div class="hero__text" appReveal>
    <h1 class="hero__title">
      {{ 'hero.greeting' | translate }} <br />
      <span class="gradient-text">Everton Gonçalves</span>
    </h1>
    <p class="hero__subtitle">{{ 'hero.subtitle' | translate }}</p>

    <div class="hero__actions">
      <a class="btn btn-primary" href="#works">
        {{ 'hero.viewPortfolio' | translate }}
        <i class="bi bi-arrow-right"></i>
      </a>
      <a class="btn btn-ghost" href="#contact">{{ 'hero.getInTouch' | translate }}</a>
    </div>

    <div class="hero__social">
      <a href="https://github.com/EvertonMLGoncalves" target="_blank" rel="noopener" aria-label="GitHub">
        <i class="bi bi-github"></i>
      </a>
      <a href="https://www.linkedin.com/in/everton-mikey-litka-gonçalves" target="_blank" rel="noopener" aria-label="LinkedIn">
        <i class="bi bi-linkedin"></i>
      </a>
    </div>
  </div>

  <div class="hero__photo" appReveal="150">
    <div class="hero__ring"></div>
    <img src="assets/imgs/photo.jpg" [alt]="'hero.photoAlt' | translate" width="480" height="480" fetchpriority="high" />
  </div>
</section>
