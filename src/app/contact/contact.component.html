<section class="section container">
  <div class="section-heading" appReveal>
    <span class="eyebrow">{{ 'contact.eyebrow' | translate }}</span>
    <h2>{{ 'contact.titleStart' | translate }} <span class="gradient-text">{{ 'contact.titleHighlight' | translate }}</span></h2>
  </div>

  <div class="links">
    @for (link of links; track link.label; let i = $index) {
      <a class="link glass" [href]="link.href" target="_blank" rel="noopener" [appReveal]="i * 100">
        <span class="link__icon"><i [class]="'bi ' + link.icon"></i></span>
        <span class="link__text">
          <small>{{ link.label }}</small>
          <span>{{ link.value }}</span>
        </span>
        <i class="bi bi-arrow-up-right link__arrow"></i>
      </a>
    }
  </div>

  <footer class="footer">
    <p>{{ 'contact.rights' | translate: { year: currentYear } }}</p>
  </footer>
</section>
